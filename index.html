<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Temperatura</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white text-center">
                        <h2 class="mb-0">Conversor de Temperatura</h2>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label for="celsius-input" class="form-label">Temperatura en Celsius  (°C)</label>
                            <input type="text" id="celsius-input" class="form-control" placeholder="Ej. 45">
                            <div id="error-message" class="text-danger mt-1 d-none">
                                Por favor, ingresa un número válido.
                            </div>
                        </div>

                        <div class="d-grid gap-2 mb-4">
                            <button id="convert-btn" class="btn btn-primary">Convertir</button>
                            <button id="prompt-btn" class="btn btn-outline-secondary">Usar alert</button>
                        </div>

                        <div class="card bg-light">
                            <div class="card-body">
                                <h5 class="card-title text-center mb-3">Resultados</h5>
                                <div class="row text-center">
                                    <div class="col-6 border-end">
                                        <p class="text-muted mb-1">Fahrenheit</p>
                                        <h3 id="fahrenheit-val" class="text-dark">--</h3>
                                    </div>
                                    <div class="col-6">
                                        <p class="text-muted mb-1">Kelvin</p>
                                        <h3 id="kelvin-val" class="text-dark">--</h3>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
